<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-panel">
      <div class="brand-block">
        <p class="eyebrow">ManufacturerHub</p>
        <h1>Admin Login</h1>
        <p>Sign in to manage product registration, analytics, revocation, and ledger records.</p>
      </div>

      <form id="loginForm" class="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Login</button>
        <p id="loginMessage" class="message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="api-config.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("loginMessage");
    const params = new URLSearchParams(window.location.search);
    const nextPage = params.get("next") || "/dashboard.html";

    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.textContent = "";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      try {
        const res = await fetch(apiUrl("/api/admin/login"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (!res.ok) {
          message.textContent = "Invalid username or password.";
          return;
        }

        window.location.href = nextPage;
      } catch (err) {
        message.textContent = "Unable to login. Please try again.";
      }
    });
  </script>
</body>
</html>
