<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Product QR</title>
  <link rel="stylesheet" href="scanner.css">
</head>
<body>
  <main class="shell">
    <section class="hero">
      <p class="eyebrow">Consumer Verification</p>
      <h1>Scan Product QR</h1>
      <p class="intro">
        Use your phone camera to scan the product QR code and start the authenticity verification process.
      </p>
    </section>

    <section class="panel">
      <div class="scanner-card">
        <div class="card-head">
          <h2>Camera Scanner</h2>
          <button id="toggleButton" type="button">Start Scanner</button>
        </div>

        <div id="scannerStatus" class="status idle">
          Scanner is idle. Press Start Scanner to begin.
        </div>

        <div id="reader" class="reader" aria-label="QR scanner area"></div>
      </div>

    </section>
  </main>

  <script src="api-config.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    const readerElementId = "reader";
    const scannerStatus = document.getElementById("scannerStatus");
    const toggleButton = document.getElementById("toggleButton");

    let scannerInstance = null;
    let scannerRunning = false;

    function setStatus(message, tone) {
      scannerStatus.textContent = message;
      scannerStatus.className = `status ${tone}`;
    }

    function extractPayload(rawValue) {
      if (!rawValue) {
        return "";
      }

      const trimmed = rawValue.trim();

      try {
        const parsed = new URL(trimmed);
        return parsed.searchParams.get("payload") || "";
      } catch (err) {
        return trimmed;
      }
    }

    function goToVerification(payload) {
      const normalizedPayload = extractPayload(payload);

      if (!normalizedPayload) {
        setStatus("No valid payload was found. Please scan the product QR code again.", "error");
        return;
      }

      window.location.href = buildVerifyUrl(normalizedPayload);
    }

    async function startScanner() {
      if (scannerRunning) {
        return;
      }

      if (!window.Html5Qrcode) {
        setStatus("Scanner library failed to load. Please refresh the page.", "error");
        return;
      }

      scannerInstance = scannerInstance || new Html5Qrcode(readerElementId);

      try {
        await scannerInstance.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 240, height: 240 }
          },
          decodedText => {
            setStatus("QR code detected. Redirecting to verification...", "success");
            stopScanner();
            goToVerification(decodedText);
          },
          () => {}
        );

        scannerRunning = true;
        toggleButton.textContent = "Stop Scanner";
        setStatus("Camera is active. Point it at the product QR code.", "live");
      } catch (err) {
        setStatus("Unable to access the camera. Please allow camera permission and try again.", "error");
      }
    }

    async function stopScanner() {
      if (!scannerInstance || !scannerRunning) {
        scannerRunning = false;
        toggleButton.textContent = "Start Scanner";
        return;
      }

      try {
        await scannerInstance.stop();
        await scannerInstance.clear();
      } catch (err) {
        // Ignore cleanup failures and keep the UI responsive.
      }

      scannerRunning = false;
      toggleButton.textContent = "Start Scanner";
      setStatus("Scanner is idle. Press Start Scanner to begin.", "idle");
    }

    toggleButton.addEventListener("click", () => {
      if (scannerRunning) {
        stopScanner();
        return;
      }

      startScanner();
    });
  </script>
</body>
</html>
