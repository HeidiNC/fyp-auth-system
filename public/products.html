<!DOCTYPE html>
<html>
<head>
  <title>Product List</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="products.css">
</head>

<body>

  <div class="sidebar">
    <img src="logo.png" alt="ManufacturerHub logo"></img>
    <a href="dashboard.html">Register Product</a>
    <a class="active" href="products.html">Product List</a>
    <a href="analytics.html">View Analytics</a>
    <a href="revocation.html">Revocation History</a>
    <button class="logout-button" type="button" onclick="logoutAdmin()">Logout</button>
  </div>

  <div class="main">

    <div class="title">
      <h1>Products List</h1>
    </div>

    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Serial</th>
          <th>Date Created</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="productTable"></tbody>
    </table>

  </div>

  <div id="revokeModal" class="modal-backdrop" hidden>
    <div class="revoke-modal" role="dialog" aria-modal="true" aria-labelledby="revokeTitle">
      <div class="modal-icon">!</div>
      <h2 id="revokeTitle">Revoke Product</h2>
      <p class="modal-copy">
        Provide a clear reason for revocation. This reason will appear in the revocation history.
      </p>

      <div class="selected-product">
        <span>Selected Product</span>
        <strong id="revokeProductName">-</strong>
        <small id="revokeProductSerial">-</small>
      </div>

      <label for="revokeReason">Revocation Reason</label>
      <textarea
        id="revokeReason"
        rows="4"
        placeholder="Example: Product reported as counterfeit, unsafe, expired, or recalled"
      ></textarea>
      <p id="revokeMessage" class="modal-message" aria-live="polite"></p>

      <div class="modal-actions">
        <button type="button" class="cancel-button" onclick="closeRevokeModal()">Cancel</button>
        <button id="confirmRevokeBtn" type="button" class="danger-button" onclick="submitRevocation()">Confirm Revocation</button>
      </div>
    </div>
  </div>

  <script src="api-config.js"></script>
  <script src="admin-auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <script>
  let selectedProductForRevocation = null;

  async function loadProducts() {
    const res = await fetch(apiUrl("/api/product/list"));
    const products = await res.json();

    const table = document.getElementById("productTable");
    table.innerHTML = "";

    products.forEach(p => {
      const qrUrl = p.qr_url || buildVerifyUrl(p.qr_payload);

      QRCode.toDataURL(qrUrl, (err, qrImage) => {
        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${escapeHtml(p.product_name)}</td>
          <td>${escapeHtml(p.serial_number)}</td>
          <td>
            ${p.created_at 
              ? new Date(p.created_at).toLocaleDateString("en-GB", {
                  day: "2-digit",
                  month: "short",
                  year: "numeric"
                })
              : "N/A"}
          </td>
          <td>
            <span class="badge ${p.product_status === 'revoked' ? 'revoked' : 'active'}">
              ${p.product_status === 'revoked' ? 'Revoked' : 'Active'}
            </span>
          </td>
          <td>
            <button
              data-download
              ${p.product_status === 'revoked' ? 'disabled' : ''}
            >
              Download
            </button>

            ${
              p.product_status === 'revoked'
                ? ''
                : `<button data-revoke>Revoke</button>`
            }
          </td>
        `;

        const downloadButton = row.querySelector("[data-download]");
        downloadButton.addEventListener("click", () => {
          downloadQR(qrImage, p.serial_number);
        });

        const revokeButton = row.querySelector("[data-revoke]");
        if (revokeButton) {
          revokeButton.addEventListener("click", () => {
            openRevokeModal(p);
          });
        }

        table.appendChild(row);
      });
    });
  }

  function downloadQR(qrImage, serial) {
    const link = document.createElement("a");
    link.href = qrImage;
    link.download = serial + ".png";
    link.click();
  }

  function openRevokeModal(product) {
    selectedProductForRevocation = product;
    document.getElementById("revokeProductName").innerText =
      product.product_name || "Unknown Product";
    document.getElementById("revokeProductSerial").innerText =
      `Serial: ${product.serial_number || "-"}`;
    document.getElementById("revokeReason").value = "";
    document.getElementById("revokeMessage").innerText = "";
    document.getElementById("revokeMessage").className = "modal-message";
    document.getElementById("revokeModal").hidden = false;
    document.getElementById("revokeReason").focus();
  }

  function closeRevokeModal() {
    document.getElementById("revokeModal").hidden = true;
    selectedProductForRevocation = null;
  }

  async function submitRevocation() {
    const reason = document.getElementById("revokeReason").value.trim();
    const message = document.getElementById("revokeMessage");
    const confirmButton = document.getElementById("confirmRevokeBtn");

    if (!selectedProductForRevocation) {
      return;
    }

    if (reason.length < 5) {
      message.innerText = "Please enter a clear revocation reason.";
      message.className = "modal-message error";
      return;
    }

    confirmButton.disabled = true;
    confirmButton.innerText = "Revoking...";
    message.innerText = "";

    try {
      const res = await fetch(apiUrl("/api/product/revoke"), {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          product_id: selectedProductForRevocation.product_id,
          reason: reason
        })
      });

      if (!res.ok) {
        const data = await res.json();
        message.innerText = data.error || "Revocation failed. Please try again.";
        message.className = "modal-message error";
        confirmButton.disabled = false;
        confirmButton.innerText = "Confirm Revocation";
        return;
      }

      message.innerText = "Product revoked successfully.";
      message.className = "modal-message success";
      loadProducts();
      setTimeout(closeRevokeModal, 700);
    } catch (err) {
      message.innerText = "Unable to connect to the server. Please try again.";
      message.className = "modal-message error";
    } finally {
      confirmButton.disabled = false;
      confirmButton.innerText = "Confirm Revocation";
    }
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  loadProducts();
  </script>

</body>
</html>
