<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900">

  <defs>
    <style>
      .bg {
        fill: #f8fafc;
      }

      .title {
        font: 700 28px Arial;
        fill: #0f172a;
      }

      .text {
        font: 700 15px Arial;
        fill: #0f172a;
      }

      .small {
        font: 13px Arial;
        fill: #334155;
      }

      .label {
        font: 600 12px Arial;
        fill: #475569;
      }

      .box {
        fill: white;
        stroke: #475569;
        stroke-width: 2;
      }

      .process {
        fill: #e0f2fe;
        stroke: #0284c7;
      }

      .storage {
        fill: #f1f5f9;
        stroke: #64748b;
      }

      .success {
        fill: #dcfce7;
        stroke: #22c55e;
      }

      .warning {
        fill: #fef3c7;
        stroke: #f59e0b;
      }

      .danger {
        fill: #fee2e2;
        stroke: #ef4444;
      }

      .decision {
        fill: #fff7ed;
        stroke: #f59e0b;
        stroke-width: 2;
      }

      .arrow {
        stroke: #475569;
        stroke-width: 2.5;
        fill: none;
        marker-end: url(#arrowhead);
      }
    </style>

    <marker id="arrowhead"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="3"
            orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>

  </defs>

  <!-- Background -->
  <rect class="bg" width="1000" height="900"/>

  <!-- STEP 1 -->
  <rect class="box process" x="380" y="60" width="240" height="72" rx="12"/>
  <text class="text" x="500" y="101" text-anchor="middle">
    Manufacturer Login
  </text>

  <!-- STEP 2 -->
  <rect class="box process" x="380" y="165" width="240" height="72" rx="12"/>
  <text class="text" x="500" y="206" text-anchor="middle">
    Register Product
  </text>

  <!-- STEP 3 -->
  <rect class="box process" x="380" y="270" width="240" height="72" rx="12"/>
  <text class="text" x="500" y="311" text-anchor="middle">
    Generate QR Code
  </text>

  <!-- STEP 4 -->
  <rect class="box storage" x="380" y="375" width="240" height="72" rx="12"/>
  <text class="text" x="500" y="416" text-anchor="middle">
    Store Product Record
  </text>

  <!-- STEP 5 -->
  <rect class="box process" x="380" y="480" width="240" height="72" rx="12"/>
  <text class="text" x="500" y="521" text-anchor="middle">
    Consumer Scans QR
  </text>

  <!-- STEP 6 -->
  <polygon class="decision"
           points="500,610 640,680 500,750 360,680"/>

  <text class="text" x="500" y="685" text-anchor="middle">
    Check Product Status
  </text>

  <!-- Authentic -->
  <rect class="box success" x="90" y="640" width="210" height="80" rx="12"/>
  <text class="text" x="195" y="674" text-anchor="middle">
    Authentic
  </text>
  <text class="small" x="195" y="699" text-anchor="middle">
    Product verified
  </text>

  <!-- Suspicious -->
  <rect class="box warning" x="380" y="800" width="240" height="80" rx="12"/>
  <text class="text" x="500" y="834" text-anchor="middle">
    Suspicious Activity
  </text>
  <text class="small" x="500" y="859" text-anchor="middle">
    Possible cloned QR detected
  </text>

  <!-- Revoked -->
  <rect class="box danger" x="700" y="640" width="210" height="80" rx="12"/>
  <text class="text" x="805" y="674" text-anchor="middle">
    Revoked
  </text>
  <text class="small" x="805" y="699" text-anchor="middle">
    Product no longer valid
  </text>

  <!-- ARROWS -->
  <line class="arrow" x1="500" y1="132" x2="500" y2="165"/>

  <line class="arrow" x1="500" y1="237" x2="500" y2="270"/>

  <line class="arrow" x1="500" y1="342" x2="500" y2="375"/>

  <line class="arrow" x1="500" y1="447" x2="500" y2="480"/>

  <line class="arrow" x1="500" y1="552" x2="500" y2="610"/>

  <!-- Decision arrows -->
  <line class="arrow" x1="360" y1="680" x2="300" y2="680"/>
  <text class="label" x="325" y="662">
    Valid
  </text>

  <line class="arrow" x1="640" y1="680" x2="700" y2="680"/>
  <text class="label" x="640" y="662">
    Revoked
  </text>

  <line class="arrow" x1="500" y1="750" x2="500" y2="800"/>
  <text class="label" x="515" y="780">
    Suspicious
  </text>

</svg>
